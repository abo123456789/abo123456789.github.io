  <style>

    .voice-info{min-width:0;flex:1}.voice-name{display:flex;align-items:center;gap:6px;font-weight:760;font-size:14px}.voice-name span{border:1px solid #cac9d2;border-radius:4px;padding:1px 3px;font-size:10px;font-weight:700;color:var(--muted)}.voice-info p{margin:3px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}.preview{width:28px;height:28px;flex:0 0 28px;padding:0;border:0;border-radius:50%;background:#f0eff5;color:var(--deep);display:inline-grid;place-items:center;line-height:1}.preview svg{display:block;width:12px;height:12px;transform:translateX(1px)}.voice.selected .preview{background:var(--violet);color:white}

    .actionbar { display:flex; align-items:center; justify-content:space-between; margin-top:24px; padding:16px 18px; border:1px solid var(--line); border-radius:16px; background:white; box-shadow:0 8px 26px rgba(16,17,20,.035); }.status{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.status-dot{width:8px;height:8px;border-radius:50%;background:#b4b5c0}.status-dot.ready{background:var(--green);box-shadow:0 0 0 4px rgba(20,158,97,.12)}.generate{border:0;border-radius:12px;padding:14px 22px;min-width:144px;background:var(--violet);color:white;font-weight:800;box-shadow:0 10px 22px rgba(113,50,245,.28);transition:.2s}.generate:hover{background:var(--deep);transform:translateY(-1px)}.generate:disabled{opacity:.68;cursor:wait;transform:none}.generate svg{margin-right:8px;vertical-align:-3px}
    .notice { display:none; margin-top:15px; padding:12px 14px; color:#8a3f09; background:#fff8ed; border:1px solid #fed7aa; border-radius:11px; font-size:13px; line-height:1.5; }.notice.show{display:block}
    @media(max-width:800px){header{height:66px;padding:0 20px}.brand{font-size:18px}.nav,.privacy{display:none}main{padding:31px 18px 22px}.studio{grid-template-columns:1fr;border-radius:16px}.editor{min-height:440px;padding:21px;border-right:0;border-bottom:1px solid var(--line)}.voice-panel{padding:21px}.voice-list{max-height:300px}.player.show{align-items:flex-start;flex-wrap:wrap}.track{min-width:calc(100% - 55px)}.download{margin-left:52px}.actionbar{padding:13px}.generate{min-width:126px;padding:13px 14px}}
    @media(max-width:430px){h1{font-size:31px}.intro{font-size:14px}.editor-bottom{align-items:flex-start;flex-direction:column}.actionbar{gap:11px}.status{font-size:12px}.generate{font-size:14px;min-width:auto}.draft{min-height:265px}textarea{min-height:198px;font-size:16px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span>声织 <small>Studio</small></div>
      <div class="privacy"><b></b>仅在你的浏览器处理</div>
    </header>
    <main>
      <div class="eyebrow">NEURAL VOICES</div>
      <h1>把文字，变成有温度的声音。</h1>
      <p class="intro">选择一位声音，调整语速和音调，让每一段文字都拥有自己的声音。</p>
      <section class="studio" aria-label="语音合成工作区">
        <div class="editor">
          <div class="panel-heading"><div><h2>输入文本</h2><p>支持中文、英文和常用标点。</p></div><button class="micro-button" id="clearText" type="button">清空</button></div>
          <div class="draft"><textarea id="text" maxlength="2000" aria-label="待合成文本" placeholder="在这里输入你想听见的文字…">那一刻，时间仿佛静止了。她深吸一口气，缓缓转过身，眼前的景象让她彻底愣住了。</textarea><div class="draft-foot"><button id="sampleText" class="sample" type="button">换一段示例 ↻</button><span id="count">0 / 2000</span></div></div>
          <div class="editor-bottom"><span class="tip"><strong>小提示：</strong>段落之间留一行，停顿会更自然。</span><span class="tip" id="duration">预计 0 秒</span></div>
        </div>
        <aside class="voice-panel">
          <div class="voice-head"><h2>选择声音</h2><select class="language" id="language" aria-label="语音语言"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="all">全部语言</option></select></div>
          <label class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="搜索声音" aria-label="搜索声音" /></label>
          <div class="voice-list" id="voiceList"></div>
          <div class="controls"><div class="control-head"><span>声音设置</span><output>实时生效</output></div><div class="range"><label class="range-row">语速<input id="rate" type="range" min="-50" max="50" value="0" /><output id="rateOut">0%</output></label><label class="range-row">音调<input id="pitch" type="range" min="-20" max="20" value="0" /><output id="pitchOut">0 Hz</output></label></div></div>
        </aside>
        <div class="player" id="player"><div class="now">♫</div><div class="track"><strong id="audioTitle">合成完成</strong><span id="audioMeta">MP3 · 已准备播放</span><audio id="audio" controls></audio></div><a id="download" class="download" href="#" download="shengzhi-voice.mp3">下载 MP3</a></div>
      </section>
      <div class="notice" id="notice" role="alert"></div>
      <div class="actionbar"><div class="status"><span class="status-dot ready" id="statusDot"></span><span id="status">已就绪 · 浏览器直连</span></div><button class="generate" id="generate" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>生成语音</button></div>
    </main>
  </div>
  <script>
    const fallbackVoices = [
      { id:'zh-CN-XiaoxiaoNeural', name:'晓晓', tag:'温柔女声', info:'自然、亲切，适合叙述与日常内容', avatar:'晓', locale:'zh-CN' },
      { id:'zh-CN-XiaoyiNeural', name:'晓伊', tag:'活力女声', info:'明快、有感染力，适合品牌表达', avatar:'伊', locale:'zh-CN' },
      { id:'zh-CN-YunxiNeural', name:'云希', tag:'阳光男声', info:'轻快、明朗，适合资讯与短视频', avatar:'希', locale:'zh-CN' },
      { id:'zh-CN-YunjianNeural', name:'云健', tag:'沉稳男声', info:'清晰、有力，适合讲解与播报', avatar:'健', locale:'zh-CN' },
      { id:'zh-CN-YunyangNeural', name:'云扬', tag:'专业男声', info:'成熟、稳定，适合知识与商务内容', avatar:'扬', locale:'zh-CN' },
      { id:'zh-CN-liaoning-XiaobeiNeural', name:'晓北', tag:'辽宁方言女声', info:'幽默、鲜活，适合地域表达', avatar:'北', locale:'zh-CN-liaoning' },
      { id:'zh-CN-shaanxi-XiaoniNeural', name:'晓妮', tag:'陕西方言女声', info:'明亮、自然，适合地域表达', avatar:'妮', locale:'zh-CN-shaanxi' },
      { id:'zh-HK-HiuGaaiNeural', name:'曉佳', tag:'粤语女声', info:'自然、亲切，适合香港粤语内容', avatar:'佳', locale:'zh-HK' },
      { id:'zh-HK-WanLungNeural', name:'雲龍', tag:'粤语男声', info:'清晰、稳重，适合香港粤语内容', avatar:'龍', locale:'zh-HK' },
      { id:'zh-TW-HsiaoChenNeural', name:'曉臻', tag:'台湾中文女声', info:'亲和、清晰，适合繁体中文内容', avatar:'臻', locale:'zh-TW' },
      { id:'zh-TW-YunJheNeural', name:'雲哲', tag:'台湾中文男声', info:'沉稳、自然，适合繁体中文内容', avatar:'哲', locale:'zh-TW' }
    ];
    let voices = [...fallbackVoices];
    const $ = s => document.querySelector(s); let selected = voices[0], audioUrl = null;
    const text = $('#text'), count = $('#count'), duration = $('#duration'), list = $('#voiceList'), notice = $('#notice');
    function escapeHtml(value){return value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
    function updateText(){ const n=text.value.length; count.textContent=`${n} / 2000`; count.classList.toggle('warn',n>1800); duration.textContent=`预计 ${Math.max(1,Math.ceil(n/4.2))} 秒`; }
    function renderVoices(filter=''){const q=filter.trim().toLowerCase(), language=$('#language').value;const visible=voices.filter(v=>(language==='all'||v.locale.toLowerCase().startsWith(language))&&(!q||`${v.name}${v.tag}${v.info}${v.id}`.toLowerCase().includes(q)));list.innerHTML=visible.map(v=>`<button type="button" class="voice ${v.id===selected.id?'selected':''}" data-voice="${v.id}"><span class="avatar">${escapeHtml(v.avatar)}</span><span class="voice-info"><span class="voice-name"><span>${escapeHtml(v.locale.split('-').slice(0,2).join('-').toUpperCase())}</span>${escapeHtml(v.name)}</span><p>${escapeHtml(v.tag)} · ${escapeHtml(v.info)}</p></span><span class="preview" aria-label="试听 ${escapeHtml(v.name)}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span></button>`).join('')||'<p style="color:#686b82;font-size:13px">没有找到匹配的声音</p>';}
    function setStatus(message, busy=false){$('#status').textContent=message;$('#statusDot').classList.toggle('ready',!busy);$('#generate').disabled=busy;$('#generate').innerHTML=busy?'正在合成…':'<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>生成语音';}
    function hideNotice(){notice.classList.remove('show');notice.textContent='';}
    function makeGec(){const token='6A5AA1D4EAFF4E9FB37E23D68491D6F4';let seconds=Date.now()/1000+11644473600;seconds-=seconds%300;const ticks=(seconds*10000000).toFixed(0);return crypto.subtle.digest('SHA-256',new TextEncoder().encode(ticks+token)).then(buffer=>[...new Uint8Array(buffer)].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase());}
    function displayName(id){const short=id.split('-').slice(2).join('-').replace('Neural','');return ({Xiaoxiao:'晓晓',Xiaoyi:'晓伊',Yunxi:'云希',Yunjian:'云健',Yunyang:'云扬'})[short]||short;}
    function normalizeVoice(voice){const categories=(voice.VoiceTag?.ContentCategories||[]).filter(Boolean), personalities=(voice.VoiceTag?.VoicePersonalities||[]).filter(Boolean);const name=displayName(voice.ShortName);return {id:voice.ShortName,name,tag:voice.Gender==='Female'?'女声':voice.Gender==='Male'?'男声':'神经语音',info:personalities[0]||categories[0]||voice.LocaleName||voice.Locale,avatar:name.slice(0,1),locale:voice.Locale};}
    async function loadVoices(){if(!isMicrosoftEdge())return;try{const token='6A5AA1D4EAFF4E9FB37E23D68491D6F4',gec=await makeGec();list.innerHTML='<p style="color:#686b82;font-size:13px">正在加载完整语音清单…</p>';const response=await fetch(`https://speech.platform.bing.com/consumer/speech/synthesize/readaloud/voices/list?trustedclienttoken=${token}&Sec-MS-GEC=${gec}&Sec-MS-GEC-Version=1-143.0.3650.75`);if(!response.ok)throw new Error('voice list unavailable');const data=await response.json();const all=data.filter(v=>v.ShortName&&v.Locale).map(normalizeVoice);if(all.length){voices=all;selected=voices.find(v=>v.id===selected.id)||voices.find(v=>v.locale.startsWith('zh'))||voices[0];renderVoices($('#search').value);setStatus(`已加载 ${voices.length} 位发音人`);}}catch(error){renderVoices($('#search').value);}}
    function requestId(){return crypto.randomUUID().replaceAll('-','');}
    function xml(value){return value.replace(/[<>&'\"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]));}
    function timestamp(){return new Date().toUTCString().replace('GMT','GMT+0000 (Coordinated Universal Time)');}
    async function synthesize(value, voice){
      const token='6A5AA1D4EAFF4E9FB37E23D68491D6F4', gec=await makeGec(), id=requestId();
      const url=`wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=${token}&Sec-MS-GEC=${gec}&Sec-MS-GEC-Version=1-143.0.3650.75&ConnectionId=${id}`;
      const rate=`${Number($('#rate').value)>=0?'+':''}${$('#rate').value}%`, pitch=`${Number($('#pitch').value)>=0?'+':''}${$('#pitch').value}Hz`;
      return new Promise((resolve,reject)=>{let chunks=[],done=false;const ws=new WebSocket(url);ws.binaryType='arraybuffer';const parts=voice.id.match(/^([a-z]{2,})-([A-Z]{2})-(.+)$/);let region=parts[2],speaker=parts[3];if(speaker.includes('-')){const chunks=speaker.split('-');region+=`-${chunks.shift()}`;speaker=chunks.join('-');}const fullVoice=`Microsoft Server Speech Text to Speech Voice (${parts[1]}-${region}, ${speaker})`;const fail=e=>{if(!done){done=true;reject(e instanceof Error?e:new Error('连接语音服务失败'));}};ws.onerror=()=>fail(new Error('无法连接语音服务。请确认网络连接后重试。'));ws.onopen=()=>{const t=timestamp();ws.send(`X-Timestamp:${t}\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":false,"wordBoundaryEnabled":false},"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}`);ws.send(`X-RequestId:${requestId()}\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:${t}\r\nPath:ssml\r\n\r\n<speak version='1.0' xml:lang='${voice.locale}' xmlns='http://www.w3.org/2001/10/synthesis'><voice name='${fullVoice}'><prosody rate='${rate}' pitch='${pitch}' volume='+0%'>${xml(value)}</prosody></voice></speak>`);};ws.onmessage=event=>{if(typeof event.data==='string'){if(event.data.includes('Path:turn.end'))ws.close();return;}const raw=new Uint8Array(event.data), h=(raw[0]<<8)|raw[1], header=new TextDecoder().decode(raw.slice(2,h+2));if(header.includes('Path:audio')&&raw.length>h+2)chunks.push(raw.slice(h+2));};ws.onclose=()=>{if(done)return;done=true;chunks.length?resolve(new Blob(chunks,{type:'audio/mpeg'})):reject(new Error('语音服务没有返回音频。它的浏览器直连协议可能暂时不可用，请稍后再试。'));};});
    }
    const isMicrosoftEdge = () => /Edg\//.test(navigator.userAgent);
    async function generate(preview=false){hideNotice();if(!isMicrosoftEdge()){notice.textContent='此纯前端直连模式需要使用 Microsoft 浏览器打开。其他浏览器无法发送所需的 WebSocket 请求头，因此不能在没有后端的情况下完成合成。';notice.classList.add('show');setStatus('请使用 Microsoft 浏览器打开');return;}const value=preview?'你好，我是'+selected.name+'。这是一段声音试听。':text.value.trim();if(!value){text.focus();notice.textContent='请先输入需要合成的文字。';notice.classList.add('show');return;}try{setStatus(preview?'正在生成试听…':'正在连接语音服务…',true);const blob=await synthesize(value,selected);if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);const audio=$('#audio');audio.src=audioUrl;$('#download').href=audioUrl;$('#audioTitle').textContent=preview?`${selected.name} · 声音试听`:`${selected.name} · 合成完成`;$('#audioMeta').textContent=`MP3 · ${selected.tag} · ${Math.round(blob.size/1024)} KB`;$('#player').classList.add('show');await audio.play().catch(()=>{});setStatus('已就绪 · 浏览器直连');}catch(error){setStatus('合成未完成 · 可重新尝试');notice.textContent=error.message;notice.classList.add('show');}}
    list.addEventListener('click',e=>{const button=e.target.closest('[data-voice]');if(!button)return;selected=voices.find(v=>v.id===button.dataset.voice);renderVoices($('#search').value);if(e.target.closest('.preview'))generate(true);});
    $('#generate').addEventListener('click',()=>generate());$('#search').addEventListener('input',e=>renderVoices(e.target.value));$('#language').addEventListener('change',()=>renderVoices($('#search').value));text.addEventListener('input',updateText);$('#clearText').addEventListener('click',()=>{text.value='';updateText();text.focus();});$('#sampleText').addEventListener('click',()=>{text.value='城市在晨雾中慢慢醒来。沿街的咖啡香，和远处的车铃声一起，写下了今天的开场。';updateText();});
    $('#rate').addEventListener('input',e=>$('#rateOut').textContent=`${Number(e.target.value)>=0?'+':''}${e.target.value}%`);$('#pitch').addEventListener('input',e=>$('#pitchOut').textContent=`${Number(e.target.value)>=0?'+':''}${e.target.value} Hz`);
    renderVoices();updateText();if(!isMicrosoftEdge()){setStatus('请使用 Microsoft 浏览器打开');notice.textContent='纯前端直连仅支持 Microsoft 浏览器。文本不会上传到本网站，但合成时会直接发送给 Microsoft 的语音服务。';notice.classList.add('show');}else{loadVoices();}
  </script>
</body>
