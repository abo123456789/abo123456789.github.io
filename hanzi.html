<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7f2e6">
<title>汉字合体 · 三年级上册</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:#2c3a25;background:#e9e3d4;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
#app{
  position:fixed;inset:0;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:radial-gradient(120% 75% at 50% -10%,#fff8e2 0%,#fdfaf1 45%,#f3f8ec 100%);
}
.view{position:absolute;inset:0;display:none;flex-direction:column;}
.view.on{display:flex;}

/* ================= 开始页 ================= */
.shd{flex:0 0 auto;text-align:center;padding:3.4vh 4vw 1.6vh;}
.shd h1{margin:0;font-size:clamp(26px,4.8vh,46px);color:#2f6b16;letter-spacing:.03em;}
.shd h1 b{color:#e08b1a;}
.shd p{margin:.7vh 0 0;font-size:clamp(12px,1.85vh,18px);color:#8b9a79;font-weight:700;}
.tgrid{
  flex:1 1 auto;display:grid;gap:1.5vh 1.3vw;padding:1.4vh 3vw 3vh;
  grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);
}
@media (orientation:portrait){ .tgrid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);} }
.tcard{
  position:relative;border:3px solid var(--c,#ccc);border-radius:18px;cursor:pointer;
  background:linear-gradient(180deg,#fff,#fbf8ee);font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45vh;
  box-shadow:0 5px 0 rgba(0,0,0,.09),0 10px 20px rgba(120,110,80,.12);
  transition:transform .09s;padding:1vh .5vw;
}
.tcard:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.09);}
.tcard .ic{font-size:clamp(24px,5vh,48px);line-height:1;}
.tcard .un{font-size:clamp(11px,1.75vh,17px);font-weight:900;color:var(--c,#666);}
.tcard .sb{font-size:clamp(9px,1.4vh,14px);color:#7f8c70;font-weight:700;}
.tcard .pg{font-size:clamp(9px,1.4vh,13px);color:#a4b096;font-weight:800;margin-top:.3vh;}
.tcard.all{--c:#8a6ad6;}
.tcard.all .ic{font-size:clamp(28px,5.6vh,54px);}

/* ================= 游戏页 ================= */
.hud{flex:0 0 auto;display:flex;align-items:center;gap:1vw;padding:1.4vh 2.4vw .6vh;}
.pill{
  display:flex;align-items:baseline;gap:.45em;background:rgba(255,255,255,.9);
  border:2px solid #e3ddca;border-radius:99px;padding:.45vh 1.1vw;
  box-shadow:0 3px 0 rgba(0,0,0,.06);
}
.pill .k{font-size:clamp(10px,1.5vh,15px);color:#96a487;font-weight:800;}
.pill .v{font-size:clamp(15px,2.4vh,26px);font-weight:900;font-variant-numeric:tabular-nums;color:#3c5c26;}
.pill.sc .v{color:#c07d10;}
.pill.cb .v{color:#d8571f;}
.pill.tm .v{color:#1e77a8;}
.pill.tm.low .v{color:#d92b2b;animation:pl .7s infinite;}
@keyframes pl{50%{opacity:.3}}
.hud .sp{flex:1;}
.iconbtn{
  width:clamp(34px,5.4vh,52px);height:clamp(34px,5.4vh,52px);border-radius:50%;
  border:2px solid #e3ddca;background:rgba(255,255,255,.92);cursor:pointer;font-family:inherit;
  font-size:clamp(15px,2.4vh,23px);display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(0,0,0,.06);
}
.iconbtn:active{transform:translateY(2px);}
.iconbtn.off{opacity:.38;}

.boardwrap{flex:1 1 auto;position:relative;padding:.8vh 2vw .6vh;}
.board{
  position:relative;width:100%;height:100%;border-radius:26px;
  background:linear-gradient(180deg,#fdfcf6,#f3f7ea);
  box-shadow:inset 0 3px 14px rgba(120,130,100,.16),0 4px 0 rgba(0,0,0,.05);
  overflow:hidden;
}
.board.chain{box-shadow:inset 0 0 0 5px #f0b429,0 0 34px rgba(240,180,41,.55),inset 0 3px 14px rgba(120,130,100,.16);}
.tile{
  position:absolute;width:var(--tw,20%);height:var(--th,25%);padding:.6%;
  transition:left .3s cubic-bezier(.3,1.25,.55,1),top .3s cubic-bezier(.3,1.25,.55,1);
  will-change:left,top;
}
.tile .face{
  width:100%;height:100%;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:clamp(22px,7vh,64px);color:#2c3a25;
  background:linear-gradient(180deg,#ffffff,#f6f3e7);
  box-shadow:0 4px 0 rgba(150,140,110,.28),inset 0 -3px 8px rgba(190,180,150,.22);
  border:2px solid #eae4d3;
  transition:transform .12s,box-shadow .15s,background .15s,border-color .15s;
  cursor:pointer;
}
.tile.t0 .face{background:linear-gradient(180deg,#ffffff,#f7f2e4);}
.tile.t1 .face{background:linear-gradient(180deg,#ffffff,#eef6e8);}
.tile.t2 .face{background:linear-gradient(180deg,#ffffff,#eef4fa);}
.tile.t3 .face{background:linear-gradient(180deg,#ffffff,#fbf0ea);}
.tile.t4 .face{background:linear-gradient(180deg,#ffffff,#f6eefb);}
.tile.sel .face{
  transform:scale(1.07);
  background:linear-gradient(180deg,#eaffe0,#cdf3c0);
  border-color:#5cc255;color:#0d5c14;
  box-shadow:0 0 0 4px rgba(92,194,85,.32),0 5px 0 rgba(60,140,50,.35);
}
.tile.bad .face{animation:shk .38s;background:linear-gradient(180deg,#ffeceb,#ffd8d6);border-color:#e05555;color:#a01a1a;}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.tile.hint .face{animation:hb .6s ease-in-out 3;}
@keyframes hb{0%,100%{transform:scale(1);box-shadow:0 4px 0 rgba(150,140,110,.28)}50%{transform:scale(1.09);box-shadow:0 0 0 5px rgba(240,180,41,.5)}}
.tile.pop{animation:pop .3s forwards;}
@keyframes pop{to{transform:scale(1.5);opacity:0;}}
.tile.fresh .face{animation:fresh .45s;}
@keyframes fresh{from{transform:rotateY(90deg) scale(.7);}}

/* 飘字 / 爆炸 */
.burst{
  position:absolute;pointer-events:none;z-index:30;
  font-weight:900;transform:translate(-50%,-50%);
  font-size:clamp(24px,4.6vh,46px);color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.22),0 0 24px rgba(255,220,120,.9);
  animation:bu .8s cubic-bezier(.2,1.4,.5,1) forwards;
}
@keyframes bu{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}
  25%{opacity:1;transform:translate(-50%,-62%) scale(1.25);}
  100%{opacity:0;transform:translate(-50%,-135%) scale(1);}
}
.pts{
  position:absolute;pointer-events:none;z-index:31;font-weight:900;
  font-size:clamp(15px,2.5vh,26px);color:#e08b1a;
  text-shadow:0 2px 0 #fff;transform:translate(-50%,-50%);
  animation:bu .85s ease-out forwards;
}
.ring{
  position:absolute;pointer-events:none;z-index:29;border-radius:50%;
  transform:translate(-50%,-50%);border:5px solid rgba(255,214,102,.95);
  animation:rg .55s ease-out forwards;
}
@keyframes rg{from{width:20px;height:20px;opacity:1;}to{width:230px;height:230px;opacity:0;}}

/* 底部 */
.foot{flex:0 0 auto;display:flex;align-items:center;gap:1.2vw;padding:.6vh 3vw 1.6vh;}
.hintbtn{
  font-family:inherit;cursor:pointer;border:none;color:#fff;font-weight:900;
  font-size:clamp(13px,2vh,20px);padding:.6em 1.6em;border-radius:99px;
  background:linear-gradient(180deg,#f0b429,#d18a0a);box-shadow:0 5px 0 #9c6504;
}
.hintbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #9c6504;}
.hintbtn:disabled{opacity:.35;box-shadow:0 5px 0 #9c6504;}
.foot .sp{flex:1;}
.chainbar{
  flex:0 0 auto;min-width:22vw;height:2.2vh;border-radius:99px;background:#e7e2d2;overflow:hidden;
}
.chainbar i{display:block;height:100%;background:linear-gradient(90deg,#7cc243,#f0b429,#e0533a);width:0%;transition:width .25s;}

/* ================= 结算 ================= */
.endwrap{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3vh 5vw;text-align:center;overflow:auto;}
.endwrap .big{font-size:clamp(52px,12vh,120px);line-height:1;}
.endwrap h2{margin:.3em 0 .1em;font-size:clamp(20px,3.4vh,34px);color:#2f6b16;}
.endwrap .sc{font-size:clamp(34px,7vh,72px);font-weight:900;color:#e08b1a;line-height:1.1;}
.endwrap .sm{font-size:clamp(12px,1.9vh,18px);color:#8b9a79;font-weight:700;margin-bottom:2vh;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw;margin:0 auto 2.4vh;max-width:680px;width:100%;}
.g4 .c{background:#fff;border:2px solid #e7e2d2;border-radius:14px;padding:.9vh .3vw;}
.g4 .c b{display:block;font-size:clamp(16px,2.9vh,30px);color:#3c5c26;}
.g4 .c span{font-size:clamp(9px,1.5vh,14px);color:#96a487;font-weight:800;}
.wordbox{
  width:min(760px,94vw);background:#fffdf6;border:2px dashed #d9d0b4;border-radius:18px;
  padding:1.4vh 2vw;margin-bottom:2.4vh;max-height:30vh;overflow:auto;text-align:left;
}
.wordbox h3{margin:0 0 .7em;font-size:clamp(12px,1.9vh,17px);color:#8b9a79;}
.wordbox .ws{display:flex;flex-wrap:wrap;gap:.6vw;}
.wordbox .w{
  font-size:clamp(12px,2vh,19px);font-weight:900;color:#2f6b16;background:#eafbe2;
  border-radius:8px;padding:.18em .6em;
}
.wordbox .w.n{color:#c07d10;background:#fff4d8;animation:fresh .5s;}
.btn{
  font-family:inherit;cursor:pointer;border:none;color:#fff;font-weight:900;
  font-size:clamp(15px,2.3vh,23px);padding:.62em 2.1em;border-radius:99px;
  background:linear-gradient(180deg,#8fd05a,#5aa62f);box-shadow:0 6px 0 #3f7d1e;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3f7d1e;}
.btn.ghost{background:linear-gradient(180deg,#fff,#eef4e6);color:#4a7a2a;box-shadow:0 5px 0 #c3ddab;margin-left:1.2vw;}
.btn.ghost:active{box-shadow:0 2px 0 #c3ddab;}

/* 开始倒数 */
.count{
  position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;
  background:rgba(28,42,22,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  font-size:clamp(70px,20vh,200px);font-weight:900;color:#fff;text-shadow:0 8px 0 rgba(0,0,0,.2);
}
.count.off{display:none;}
.count span{animation:cz .8s ease-out;}
@keyframes cz{0%{transform:scale(2.2);opacity:0}35%{transform:scale(1);opacity:1}100%{transform:scale(.85);opacity:.85}}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 开始页 ===== -->
  <section class="view on" id="v-start">
    <div class="shd">
      <h1>汉字<b>合体</b></h1>
      <p>找出能组成词语的两个字 · 三年级上册词库</p>
    </div>
    <div class="tgrid" id="tgrid"></div>
  </section>

  <!-- ===== 游戏页 ===== -->
  <section class="view" id="v-game">
    <div class="hud">
      <div class="pill sc"><span class="k">分数</span><span class="v" id="hScore">0</span></div>
      <div class="pill cb"><span class="k">连击</span><span class="v" id="hCombo">0</span></div>
      <div class="pill tm" id="hTimeBox"><span class="k">时间</span><span class="v" id="hTime">90</span></div>
      <div class="sp"></div>
      <button class="iconbtn" id="bQuit">✕</button>
    </div>
    <div class="boardwrap"><div class="board" id="board"></div></div>
    <div class="foot">
      <button class="hintbtn" id="bHint">💡 提示 <span id="hintN">3</span></button>
      <div class="chainbar"><i id="chainFill"></i></div>
      <div class="sp"></div>
      <div class="pill"><span class="k">词库</span><span class="v" id="hWords">0</span></div>
      <button class="iconbtn" id="bTts">🔊</button>
      <button class="iconbtn" id="bSfx">🎵</button>
    </div>
  </section>

  <!-- ===== 结算页 ===== -->
  <section class="view" id="v-end"><div class="endwrap" id="endWrap"></div></section>

</div>

<div class="count off" id="count"><span id="countN">3</span></div>

<script>
/* 词库：按三年级上册 8 个单元分组，全部是课文里出现过的词或同主题常用词 */
const THEMES = [
  { id:1, unit:'第一单元', sub:'美丽的校园', icon:'🏫', color:'#e0a02a',
    words:['小学','同学','老师','朋友','读书','课文','铜钟','国旗','敬礼','蝴蝶','猴子','孔雀','校园','放假','花朵','学问','问题','意思','朗读','服装','鲜艳','山林','招呼','敬爱','大树','小鸟','教室','黑板'] },

  { id:2, unit:'第二单元', sub:'金秋时节', icon:'🍂', color:'#d9762a',
    words:['秋天','枫叶','丰收','秋风','凉风','果园','黄色','落叶','白霜','菊花','颜料','钥匙','枫树','邮票','香甜','金色','石径','白云','枫林','青螺','洞庭','西湖','山色','水泥','巴掌','细雨','大门','清凉','橘子','成熟'] },

  { id:3, unit:'第三单元', sub:'童话世界', icon:'🐢', color:'#3f9e5a',
    words:['老屋','小猫','母鸡','蜘蛛','乌龟','蜗牛','壁虎','乌鸦','狮子','婚礼','决定','出发','坚持','狐狸','杜鹃','猎人','故事','结尾','名字','公鸡','庆祝','邀请','飘落','一直','教室','认真','快乐','记得'] },

  { id:4, unit:'第四单元', sub:'奇妙的想象', icon:'🍶', color:'#8a6ad6',
    words:['葫芦','秘密','奶奶','愿望','蚂蚁','奶酪','队长','规矩','旅行','喷嚏','肚子','童话','想象','奇妙','朋友','帮忙','冷静','勇敢','干活','发现','神奇','宝贝','高兴','答应','觉得','果然'] },

  { id:5, unit:'第五单元', sub:'留心观察', icon:'🐦', color:'#1f9ab8',
    words:['翠鸟','羽毛','翅膀','红色','捕鱼','草地','金色','手掌','合拢','张开','观察','有趣','玩耍','钓鱼','花瓣','弟弟','长嘴','冲进','飞起','仔细','变化','中午','悄悄','忽然','动作','样子'] },

  { id:6, unit:'第六单元', sub:'祖国河山', icon:'🏔️', color:'#2f7fd0',
    words:['西沙','群岛','南海','物产','贝壳','海龟','沙滩','渔民','军舰','海鸥','榕树','石凳','街道','小城','公园','干净','整洁','宝库','兴安','积雪','溪水','香港','明珠','万国','美食','天堂','海洋','夜晚','灯光','高山','森林','海湾'] },

  { id:7, unit:'第七单元', sub:'大自然', icon:'🍃', color:'#5aa62f',
    words:['声音','音乐','微风','雨滴','小溪','河流','大海','动物','歌手','鸟叫','虫鸣','自然','奥秘','乐趣','竹叶','棕榈','池塘','搬家','老鹰','麻雀','演奏','温柔','雄伟','汇集','感受','世界','奇妙','树林','小草','蓝天'] },

  { id:8, unit:'第八单元', sub:'美好品质', icon:'🕯️', color:'#c74b4b',
    words:['石头','水缸','得救','争气','生物','留学','手术','医生','伤员','阵地','粗瓷','大碗','高粱','米饭','野菜','战士','同志','关心','勇敢','诚实','品质','珍惜','刻苦','努力','认真','帮助','冷静','坚持'] },
];

/* 全部词（去重） */
const ALL_WORDS = (() => {
  const s = new Set();
  THEMES.forEach(t => t.words.forEach(w => s.add(w)));
  return Array.from(s);
})();

/* =====================================================
   工具
   ===================================================== */
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }

let COLS = 5, ROWS = 4, CELLS = COLS * ROWS;
/* 竖屏时换成 4 列 5 行，格子才不会又窄又长 */
function fitGrid(){
  const portrait = window.innerHeight > window.innerWidth;
  COLS = portrait ? 4 : 5;
  ROWS = portrait ? 5 : 4;
  CELLS = COLS * ROWS;
  boardEl.style.setProperty('--tw', (100 / COLS) + '%');
  boardEl.style.setProperty('--th', (100 / ROWS) + '%');
}

/* 合法词判定
   WORDSET = 课本词库（合成的词会计入"我的词库"）
   VALID   = 课本词库 + 词典兜底词
   兜底词是用 jieba 词典在构建时算出来的：盘上的字能组成、但课本词表没收的词，
   比如「孔子」（孔来自"孔雀"、子来自"猴子"）。不然会出现"明明是对的却判你错"。*/
let WORDSET = new Set();
let VALID = new Set();
function buildLookup(list){
  WORDSET = new Set(list);
  VALID = new Set(list);
  if (typeof EXTRA !== 'undefined') EXTRA.forEach(w => VALID.add(w));
}
function lookupWord(a, b){
  // 先按点击顺序判定；顺序反了但确实是词，也接受，并显示正确写法
  if (VALID.has(a + b)) return a + b;
  if (VALID.has(b + a)) return b + a;
  return null;
}

/* =====================================================
   音效
   ===================================================== */
let AC = null, sfxOn = true;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, ty, v, delay){
  if(!sfxOn) return;
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = ty || 'sine';
  o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(v==null?.15:v, t0+.01);
  g.gain.exponentialRampToValueAtTime(.0001, t0+d);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+d+.03);
}
const SFX = {
  tap(){ tone(760, .05, 'sine', .09); },
  up(n){ tone(720 + n*90, .07, 'sine', .10); },
  down(){ tone(260, .1, 'square', .09); },
  bad(){ tone(230, .13, 'square', .11); tone(165, .2, 'square', .1, .1); },
  clear(combo){
    const base = 620 + Math.min(combo,10) * 70;
    [0,1,2].forEach(i => tone(base * Math.pow(1.26, i), .17, 'triangle', .15, i*.055));
  },
  over(){ [660,560,470,350].forEach((f,i)=>tone(f,.3,'triangle',.15,i*.15)); },
};

/* =====================================================
   语音：edge-tts 预生成（zh-CN-XiaoxiaoNeural）
   —— 打包成 base64 内嵌，iPad 离线也能听，不依赖任何服务器
   ===================================================== */
let ttsOn = true;
let audioEl = null;

function speak(word){
  if(!ttsOn) return;
  const uri = AUDIO[word];
  if(!uri) return;
  try{
    if(!audioEl){
      audioEl = new Audio();
      audioEl.preload = 'auto';
    }
    if(audioEl.dataset.w !== word){
      audioEl.src = uri;
      audioEl.dataset.w = word;
    }
    try{ audioEl.currentTime = 0; }catch(e){}
    const p = audioEl.play();
    if(p && p.catch) p.catch(() => {});
  }catch(e){}
}
function shutup(){
  if(!audioEl) return;
  try{ audioEl.pause(); audioEl.currentTime = 0; }catch(e){}
}

/* =====================================================
   存档
   ===================================================== */
const KEY = 'hanzi-merge-v1';
let SAVE = { words:[], best:{} };
try{ const r = localStorage.getItem(KEY); if(r) SAVE = JSON.parse(r); }catch(e){}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(SAVE)); }catch(e){} }

/* =====================================================
   开始页
   ===================================================== */
function renderStart(){
  const g = $('tgrid'); g.innerHTML = '';
  const mk = (label, sub, icon, color, words, all) => {
    const got = words.filter(w => SAVE.words.indexOf(w) >= 0).length;
    const b = document.createElement('button');
    b.className = 'tcard' + (all ? ' all' : '');
    b.style.setProperty('--c', color);
    b.innerHTML =
      '<div class="ic">' + icon + '</div>' +
      '<div class="un">' + label + '</div>' +
      '<div class="sb">' + sub + '</div>' +
      '<div class="pg">词库 ' + got + '/' + words.length + '</div>';
    b.addEventListener('click', () => { SFX.tap(); startGame(words); });
    g.appendChild(b);
  };
  THEMES.forEach(t => mk(t.unit, t.sub, t.icon, t.color, t.words, false));
  mk('全部混合', '8 个单元一起上', '🎲', '#8a6ad6', ALL_WORDS, true);
}

/* =====================================================
   游戏状态
   ===================================================== */
const G = {
  on:false, board:[], tiles:[], sel:null, lock:false,
  score:0, combo:0, maxCombo:0, time:90, formed:[], newWords:[],
  pool:[], hintLeft:3, comboDeadline:0, timerId:null, rafId:null, started:0
};

let boardEl = null;

function makeTile(ch, col, row){
  const el = document.createElement('div');
  el.className = 'tile t' + rnd(5);
  const f = document.createElement('div');
  f.className = 'face'; f.textContent = ch;
  el.appendChild(f);
  const t = { el, face:f, ch, col, row };
  el.addEventListener('click', () => tapTile(t));
  return t;
}

function placeTile(t, instant){
  if(instant){ t.el.style.transition = 'none'; }
  t.el.style.left = (t.col * 100 / COLS) + '%';
  t.el.style.top  = (t.row * 100 / ROWS) + '%';
  if(instant){
    void t.el.offsetWidth;
    t.el.style.transition = '';
  }
}

function allTiles(){ return G.board.filter(Boolean); }

function setChar(t, ch){
  t.ch = ch;
  t.face.textContent = ch;
  t.el.classList.add('fresh');
  setTimeout(() => t.el.classList.remove('fresh'), 480);
}

/* ---------- 布盘 ---------- */
function seedBoard(){
  const usedWords = new Set();
  const chars = [];
  let guard = 0;
  while(chars.length < CELLS && guard++ < 600){
    const w = G.pool[rnd(G.pool.length)];
    if(w.length !== 2) continue;
    if(usedWords.has(w)) continue;
    if(chars.indexOf(w[0]) >= 0 || chars.indexOf(w[1]) >= 0) continue;
    usedWords.add(w); chars.push(w[0], w[1]);
  }
  while(chars.length < CELLS){                    // 兜底：允许重复
    const w = G.pool[rnd(G.pool.length)];
    chars.push(w[0], w[1]);
  }
  shuffle(chars);
  boardEl.innerHTML = '';
  G.board = new Array(CELLS).fill(null);
  G.tiles = [];
  for(let i = 0; i < CELLS; i++){
    const col = i % COLS, row = Math.floor(i / COLS);
    const t = makeTile(chars[i], col, row);
    G.board[col * ROWS + row] = t;
    G.tiles.push(t);
    boardEl.appendChild(t.el);
    placeTile(t, true);
    t.el.style.opacity = '0';
    setTimeout(() => { t.el.style.transition = 'opacity .3s, left .3s, top .3s'; t.el.style.opacity = '1'; }, 40 + i * 22);
  }
}

/* ---------- 找可消对 ---------- */
function findPairs(){
  const ts = allTiles(), out = [];
  for(let i = 0; i < ts.length; i++)
    for(let j = i + 1; j < ts.length; j++){
      const w = lookupWord(ts[i].ch, ts[j].ch);
      if(w) out.push([ts[i], ts[j], w]);
    }
  return out;
}

/* 保证场上至少有 n 对可消，否则换字 */
function ensureSolvable(n){
  let guard = 0;
  while(findPairs().length < n && guard++ < 24){
    const w = G.pool[rnd(G.pool.length)];
    if(w.length !== 2) continue;
    const ts = shuffle(allTiles().slice());
    if(ts.length < 2) return;
    const a = ts[0], b = ts.find(t => t !== a && t.ch !== w[0] && t.ch !== w[1]);
    if(!b) continue;
    if(a.ch === w[0] && b.ch === w[1]) continue;
    setChar(a, w[0]); setChar(b, w[1]);
  }
}

/* ---------- 点击 ---------- */
function tapTile(t){
  if(!G.on || G.lock) return;
  if(G.sel === t){                        // 取消选择
    t.el.classList.remove('sel'); G.sel = null; SFX.tap(); return;
  }
  if(!G.sel){
    G.sel = t; t.el.classList.add('sel'); SFX.up(0); return;
  }
  const a = G.sel, b = t;
  a.el.classList.remove('sel');
  G.sel = null;
  const w = lookupWord(a.ch, b.ch);
  if(w){ doClear(a, b, w); }
  else {
    SFX.bad();
    G.lock = true;
    a.el.classList.add('bad'); b.el.classList.add('bad');
    G.combo = 0; updateHUD();
    setTimeout(() => {
      a.el.classList.remove('bad'); b.el.classList.remove('bad');
      G.lock = false;
    }, 380);
  }
}

/* ---------- 消除 ---------- */
function doClear(a, b, word){
  G.lock = true;
  G.combo++;
  G.maxCombo = Math.max(G.maxCombo, G.combo);
  const pts = 10 + Math.min(G.combo - 1, 6) * 5;
  G.score += pts;
  G.time = Math.min(99, G.time + 1.0);
  if(G.formed.indexOf(word) < 0) G.formed.push(word);
  if(SAVE.words.indexOf(word) < 0){ SAVE.words.push(word); G.newWords.push(word); persist(); }
  G.comboDeadline = performance.now() + 4200;

  const br = boardEl.getBoundingClientRect();
  const ra = a.el.getBoundingClientRect(), rb = b.el.getBoundingClientRect();
  const mx = (ra.left + ra.width/2 + rb.left + rb.width/2)/2 - br.left;
  const my = (ra.top + ra.height/2 + rb.top + rb.height/2)/2 - br.top;

  a.el.classList.add('pop'); b.el.classList.add('pop');
  ringAt(mx, my);
  burstAt(mx, my, word, pts);
  SFX.clear(G.combo);
  speak(word);
  if(G.combo >= 3) boardEl.classList.add('chain');
  updateHUD();

  setTimeout(() => {
    a.el.remove(); b.el.remove();
    G.tiles = G.tiles.filter(t => t !== a && t !== b);
    G.board = G.board.map(t => (t === a || t === b) ? null : t);
    collapse();
  }, 300);
}

function ringAt(x, y){
  const r = document.createElement('div');
  r.className = 'ring'; r.style.left = x + 'px'; r.style.top = y + 'px';
  boardEl.appendChild(r); setTimeout(() => r.remove(), 560);
}
function burstAt(x, y, word, pts){
  const d = document.createElement('div');
  d.className = 'burst'; d.textContent = word;
  d.style.left = x + 'px'; d.style.top = y + 'px';
  boardEl.appendChild(d);
  const p = document.createElement('div');
  p.className = 'pts'; p.textContent = '+' + pts + (G.combo > 1 ? '  ×' + G.combo : '');
  p.style.left = x + 'px'; p.style.top = (y + 34) + 'px';
  boardEl.appendChild(p);
  setTimeout(() => { d.remove(); p.remove(); }, 900);
}

/* ---------- 补字策略 ----------
   优先补一个"能和场上已有字组成词"的字 —— 这样消掉一对之后，
   经常马上又冒出一对新可消对，形成连锁；顺带减少重复字         */
function pickNewChar(onBoard){
  const complete = [], fresh = [];
  for(let i = 0; i < G.pool.length; i++){
    const w = G.pool[i];
    if(w.length !== 2) continue;
    const a = w[0], b = w[1];
    if(a === b) continue;
    const ha = onBoard.has(a), hb = onBoard.has(b);
    if(ha && !hb) complete.push(b);
    else if(hb && !ha) complete.push(a);
    if(!ha) fresh.push(a);
    if(!hb) fresh.push(b);
  }
  let ch;
  if(complete.length && Math.random() < 0.82) ch = complete[rnd(complete.length)];
  else if(fresh.length) ch = fresh[rnd(fresh.length)];
  else ch = G.pool[rnd(G.pool.length)][rnd(2)];
  onBoard.add(ch);
  return ch;
}

/* ---------- 塌落 ---------- */
function collapse(){
  const onBoard = new Set();
  G.board.forEach(t => { if(t) onBoard.add(t.ch); });
  for(let c = 0; c < COLS; c++){
    const col = [];
    for(let r = 0; r < ROWS; r++) col.push(G.board[c * ROWS + r]);
    const kept = col.filter(Boolean);
    const need = ROWS - kept.length;
    const made = [];
    for(let i = 0; i < need; i++){
      const t = makeTile(pickNewChar(onBoard), c, 0);
      boardEl.appendChild(t.el);
      t.el.style.transition = 'none';
      t.el.style.left = (c * 100 / COLS) + '%';
      t.el.style.top = (-(need - i) * 100 / ROWS) + '%';
      made.push(t);
    }
    const nc = made.concat(kept);
    for(let r = 0; r < ROWS; r++) G.board[c * ROWS + r] = nc[r] || null;
  }
  G.tiles = G.board.filter(Boolean);
  void boardEl.offsetHeight;
  requestAnimationFrame(() => {
    for(let c = 0; c < COLS; c++)
      for(let r = 0; r < ROWS; r++){
        const t = G.board[c * ROWS + r];
        if(t){ t.col = c; t.row = r; placeTile(t); }
      }
    setTimeout(() => {
      ensureSolvable(3);
      G.lock = false;
      if(G.combo < 3) boardEl.classList.remove('chain');
    }, 340);
  });
}

/* ---------- 提示 ---------- */
function doHint(){
  if(!G.on || G.hintLeft <= 0 || G.lock) return;
  const ps = findPairs();
  if(!ps.length) return;
  G.hintLeft--;
  SFX.tap();
  G.time = Math.max(0, G.time - 3);
  updateHUD();
  const p = ps[rnd(ps.length)];
  p[0].el.classList.add('hint'); p[1].el.classList.add('hint');
  setTimeout(() => { p[0].el.classList.remove('hint'); p[1].el.classList.remove('hint'); }, 1900);
}

/* ---------- HUD ---------- */
function updateHUD(){
  $('hScore').textContent = G.score;
  $('hCombo').textContent = G.combo > 1 ? '×' + G.combo : G.combo;
  $('hTime').textContent = Math.max(0, Math.ceil(G.time));
  $('hTimeBox').classList.toggle('low', G.time <= 15);
  $('hWords').textContent = SAVE.words.length;
  $('hintN').textContent = G.hintLeft;
  $('bHint').disabled = G.hintLeft <= 0;
  const left = Math.max(0, G.comboDeadline - performance.now());
  $('chainFill').style.width = G.combo > 1 ? Math.min(100, left / 42) + '%' : '0%';
}

/* ---------- 主循环 ---------- */
let lastT = 0, hudTick = 0;
function loop(now){
  if(!G.on) return;
  if(!lastT) lastT = now;
  let dt = (now - lastT) / 1000;          // 按真实时间走，跟帧率无关
  lastT = now;
  if(dt > 0.25) dt = 0.25;                // 切后台回来不要一次扣掉一大截
  G.time -= dt;
  if(G.combo > 0 && now > G.comboDeadline){
    G.combo = 0; boardEl.classList.remove('chain');
  }
  if((hudTick = (hudTick + 1) % 5) === 0) updateHUD();
  if(G.time <= 0){ updateHUD(); endGame(); return; }
  G.rafId = requestAnimationFrame(loop);
}

/* =====================================================
   开一局
   ===================================================== */
function startGame(pool){
  shutup();
  G.pool = pool.filter(w => w.length === 2);
  buildLookup(G.pool);
  Object.assign(G, {
    on:false, sel:null, lock:true, score:0, combo:0, maxCombo:0,
    time:90, formed:[], newWords:[], hintLeft:3, comboDeadline:0
  });
  boardEl = $('board');
  boardEl.classList.remove('chain');
  view('v-game');
  updateHUD();
  fitGrid();
  seedBoard();

  let n = 3;
  $('count').classList.remove('off');
  $('countN').textContent = n;
  $('countN').style.animation = 'none'; void $('countN').offsetWidth; $('countN').style.animation = '';
  SFX.tap();
  const cd = setInterval(() => {
    n--;
    if(n > 0){
      $('countN').textContent = n;
      $('countN').style.animation = 'none'; void $('countN').offsetWidth; $('countN').style.animation = '';
      SFX.tap();
    } else {
      clearInterval(cd);
      $('countN').textContent = '开始！';
      $('countN').style.animation = 'none'; void $('countN').offsetWidth; $('countN').style.animation = '';
      tone(880, .18, 'triangle', .16);
      setTimeout(() => {
        $('count').classList.add('off');
        G.on = true; G.lock = false;
        lastT = 0; hudTick = 0;
        G.rafId = requestAnimationFrame(loop);
        // 开局轻提示：闪一对给他看
        const ps = findPairs();
        if(ps.length){
          const p = ps[0];
          p[0].el.classList.add('hint'); p[1].el.classList.add('hint');
          setTimeout(() => { p[0].el.classList.remove('hint'); p[1].el.classList.remove('hint'); }, 2000);
        }
      }, 620);
    }
  }, 800);
}

/* =====================================================
   结算
   ===================================================== */
function endGame(){
  G.on = false;
  cancelAnimationFrame(G.rafId);
  clearTimeout(G.timerId);
  boardEl.classList.remove('chain');
  if(G.sel){ G.sel.el.classList.remove('sel'); G.sel = null; }
  SFX.over();
  shutup();

  const isNew = G.score > (SAVE.best.all || 0);
  SAVE.best.all = Math.max(SAVE.best.all || 0, G.score);
  persist();

  const list = G.formed.length
    ? G.formed.map(w => '<span class="w' + (G.newWords.indexOf(w) >= 0 ? ' n' : '') + '">' + w + '</span>').join('')
    : '<span style="color:#b6b09c;font-weight:800;font-size:clamp(12px,1.9vh,17px)">这一局还没合成词语，再来一次吧！</span>';

  $('endWrap').innerHTML =
    '<div class="big">' + (G.score >= 300 ? '🏆' : G.score >= 150 ? '🎉' : '💪') + '</div>' +
    '<h2>' + (G.score >= 300 ? '太厉害了！' : G.score >= 150 ? '干得不错！' : '再练一练') + '</h2>' +
    '<div class="sc">' + G.score + '</div>' +
    '<div class="sm">' + (isNew ? '🎊 新纪录！' : '历史最高 ' + (SAVE.best.all || 0)) + '</div>' +
    '<div class="g4">' +
      '<div class="c"><b>' + G.formed.length + '</b><span>本局合成</span></div>' +
      '<div class="c"><b>×' + G.maxCombo + '</b><span>最高连击</span></div>' +
      '<div class="c"><b>' + G.newWords.length + '</b><span>新收录</span></div>' +
      '<div class="c"><b>' + SAVE.words.length + '</b><span>词库总数</span></div>' +
    '</div>' +
    '<div class="wordbox"><h3>本局合成的词</h3><div class="ws">' + list + '</div></div>' +
    '<div><button class="btn" id="bAgain">再来一局</button><button class="btn ghost" id="bHome">换个单元</button></div>';

  $('bAgain').addEventListener('click', () => startGame(G.pool.slice()));
  $('bHome').addEventListener('click', () => { renderStart(); view('v-start'); });
  view('v-end');
}

/* =====================================================
   导航 / 按钮
   ===================================================== */
function view(id){
  ['v-start','v-game','v-end'].forEach(v => $(v).classList.toggle('on', v === id));
}
$('bQuit').addEventListener('click', () => {
  if(!G.on) return;
  if(!confirm('结束这一局？')) return;
  endGame();
});
$('bHint').addEventListener('click', doHint);
$('bTts').addEventListener('click', e => {
  ttsOn = !ttsOn; e.currentTarget.classList.toggle('off', !ttsOn);
  if(!ttsOn) shutup();
  else speak('秋天');        // edge-tts 真人发音，打开时给个样例
});
$('bSfx').addEventListener('click', e => {
  sfxOn = !sfxOn; e.currentTarget.classList.toggle('off', !sfxOn);
  if(sfxOn){ ac(); tone(880,.1,'triangle',.15); }
});

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, { passive:false });

renderStart();
view('v-start');
</script>
