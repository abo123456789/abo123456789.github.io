<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>围棋对弈</title>
    <link rel="icon" type="image/x-icon" href="../images/001.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .board-wrapper {
            background: linear-gradient(145deg, #d4a574, #c89858);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6),
                        inset 0 0 40px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .board-wrapper::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 4px solid rgba(139, 69, 19, 0.3);
            border-radius: 20px;
            pointer-events: none;
        }

        .board-wrapper::after {
            content: '围棋';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #c9302c 0%, #d4145a 100%);
            color: white;
            padding: 8px 25px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(201, 48, 44, 0.4);
        }

        #goBoard {
            background: linear-gradient(145deg, #daa520, #b8860b);
            border-radius: 15px;
            box-shadow: inset 0 8px 20px rgba(0, 0, 0, 0.3);
            cursor: crosshair;
            display: block;
        }

        .control-panel {
            background: linear-gradient(145deg, #ffffff, #f5f5f5);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
            min-width: 320px;
            max-width: 400px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #667eea #f5f5f5;
        }

        .control-panel::-webkit-scrollbar {
            width: 6px;
        }

        .control-panel::-webkit-scrollbar-track {
            background: #f5f5f5;
            border-radius: 10px;
        }

        .control-panel::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        .control-panel::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .game-title {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #c9302c 0%, #d4145a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .player-section {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
            background: #f8f9fa;
            border: 3px solid transparent;
        }

        .player-section.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #ffd700;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            transform: scale(1.03);
        }

        .stone-display {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .stone-display.black {
            background: radial-gradient(circle at 35% 35%, #4a4a4a, #000000);
        }

        .stone-display.white {
            background: radial-gradient(circle at 35% 35%, #ffffff, #d0d0d0);
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .player-captures {
            font-size: 0.95rem;
            opacity: 0.8;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 18px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-btn {
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .game-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .game-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mode-selector {
            background: #f8f9fa;
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .mode-selector h4 {
            color: #2c3e50;
            margin-bottom: 12px;
            font-size: 1.05rem;
            font-weight: bold;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            font-weight: 600;
            color: #666;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            box-shadow: 0 3px 12px rgba(102, 126, 234, 0.4);
        }

        .mode-btn:hover:not(.active) {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-1px);
        }

        .difficulty-selector {
            margin-top: 12px;
            display: none;
        }

        .difficulty-selector.show {
            display: block;
        }

        .difficulty-selector label {
            display: block;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .difficulty-buttons {
            display: flex;
            gap: 8px;
        }

        .diff-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
        }

        .diff-btn.active {
            background: #4facfe;
            color: white;
            border-color: #4facfe;
        }

        .diff-btn:hover:not(.active) {
            border-color: #4facfe;
            color: #4facfe;
        }

        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-pass {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-undo {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-score {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .message-box {
            margin-top: 20px;
            padding: 18px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.05rem;
            display: none;
            animation: slideIn 0.5s ease-out;
        }

        .message-box.show {
            display: block;
        }

        .message-box.info {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            color: #1565c0;
        }

        .message-box.success {
            background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
            color: #2e7d32;
        }

        .message-box.warning {
            background: linear-gradient(135deg, #fff9c4, #fff59d);
            color: #f57f17;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 胜利/失败弹窗样式 */
        .game-result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-out;
        }

        .game-result-modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .result-content {
            background: white;
            padding: 50px 60px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 90%;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5) rotate(-10deg);
                opacity: 0;
            }
            70% {
                transform: scale(1.1) rotate(5deg);
            }
            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        .result-icon {
            font-size: 100px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .result-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-title.victory {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-title.defeat {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-details {
            font-size: 1.3rem;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .result-score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 15px 0;
        }

        .result-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .result-btn {
            padding: 15px 35px;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .result-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .result-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .result-btn.secondary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .rules-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #555;
            line-height: 1.6;
        }

        .rules-section h4 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .rules-section h4::after {
            content: '▼';
            font-size: 0.8rem;
            transition: transform 0.3s;
        }

        .rules-section.collapsed h4::after {
            transform: rotate(-90deg);
        }

        .rules-content {
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .rules-section.collapsed .rules-content {
            max-height: 0;
        }

        .rules-section ul {
            margin-left: 20px;
        }

        .rules-section li {
            margin-bottom: 5px;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(67, 233, 123, 0.4);
            transition: all 0.3s;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(67, 233, 123, 0.5);
        }

        /* iPad 和平板优化 */
        @media (min-width: 768px) and (max-width: 1024px) {
            body {
                padding: 10px;
                align-items: flex-start;
                overflow-y: auto;
            }

            .game-container {
                flex-direction: row;
                gap: 20px;
                width: 100%;
                max-width: 1000px;
                margin: 0 auto;
            }

            .board-wrapper {
                flex: 1;
                padding: 25px;
                max-width: 500px;
            }

            #goBoard {
                width: 100% !important;
                height: auto !important;
                max-width: 450px;
            }

            .control-panel {
                flex: 0 0 340px;
                max-width: 340px;
                padding: 20px;
                max-height: calc(100vh - 80px);
                overflow-y: auto;
            }

            .game-title {
                font-size: 1.5rem;
                margin-bottom: 15px;
            }

            .mode-selector {
                padding: 12px;
                margin-bottom: 15px;
            }

            .mode-selector h4 {
                font-size: 0.9rem;
                margin-bottom: 8px;
            }

            .mode-btn, .diff-btn {
                padding: 8px;
                font-size: 0.8rem;
            }

            .player-section {
                padding: 12px;
                margin-bottom: 12px;
                gap: 10px;
            }

            .stone-display {
                width: 35px;
                height: 35px;
            }

            .player-name {
                font-size: 1rem;
            }

            .player-captures {
                font-size: 0.8rem;
            }

            .stats-grid {
                gap: 10px;
                margin-bottom: 15px;
            }

            .stat-card {
                padding: 12px;
            }

            .stat-label {
                font-size: 0.8rem;
            }

            .stat-value {
                font-size: 1.3rem;
            }

            .button-group {
                gap: 10px;
            }

            .game-btn {
                padding: 12px;
                font-size: 0.95rem;
            }

            .message-box {
                padding: 12px;
                font-size: 0.9rem;
                margin-top: 15px;
            }

            .rules-section {
                padding: 12px;
                font-size: 0.8rem;
                margin-top: 15px;
            }

            .rules-section h4 {
                font-size: 0.95rem;
                margin-bottom: 8px;
            }

            .rules-section ul {
                margin-left: 15px;
            }

            .rules-section li {
                margin-bottom: 3px;
            }

            .back-button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }

        /* 手机小屏幕 */
        @media (max-width: 767px) {
            body {
                padding: 10px;
            }

            .game-container {
                flex-direction: column;
                gap: 20px;
            }

            .board-wrapper {
                padding: 20px;
                width: 100%;
            }

            .board-wrapper::after {
                font-size: 1rem;
                padding: 6px 20px;
            }

            #goBoard {
                width: 100% !important;
                height: auto !important;
                max-width: 100%;
            }

            .control-panel {
                width: 100%;
                min-width: auto;
                padding: 25px;
            }

            .game-title {
                font-size: 1.8rem;
            }

            .player-section {
                padding: 15px;
            }

            .stone-display {
                width: 40px;
                height: 40px;
            }

            .player-name {
                font-size: 1.1rem;
            }

            .player-captures {
                font-size: 0.85rem;
            }

            .stats-grid {
                gap: 12px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-label {
                font-size: 0.85rem;
            }

            .stat-value {
                font-size: 1.5rem;
            }

            .game-btn {
                padding: 14px;
                font-size: 1rem;
            }

            .rules-section {
                padding: 15px;
                font-size: 0.85rem;
            }

            .rules-section h4 {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .board-wrapper {
                padding: 15px;
            }

            .control-panel {
                padding: 15px;
            }

            .game-title {
                font-size: 1.3rem;
                margin-bottom: 15px;
            }

            .mode-selector {
                padding: 12px;
            }

            .mode-selector h4 {
                font-size: 0.9rem;
            }

            .player-section {
                gap: 10px;
                padding: 10px;
            }

            .stone-display {
                width: 30px;
                height: 30px;
            }

            .player-name {
                font-size: 0.95rem;
            }

            .player-captures {
                font-size: 0.75rem;
            }

            .stat-card {
                padding: 10px;
            }

            .stat-label {
                font-size: 0.75rem;
            }

            .stat-value {
                font-size: 1.2rem;
            }

            .game-btn {
                padding: 10px;
                font-size: 0.9rem;
            }

            .message-box {
                padding: 12px;
                font-size: 0.85rem;
            }

            .rules-section {
                padding: 12px;
                font-size: 0.8rem;
            }

            .rules-section h4 {
                font-size: 0.9rem;
            }

            .back-button {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }

        /* 横屏适配（如iPad横屏） */
        @media (orientation: landscape) and (max-height: 900px) {
            body {
                align-items: flex-start;
                padding: 10px;
            }

            .game-container {
                flex-direction: row;
                align-items: flex-start;
            }

            .board-wrapper {
                flex: 1;
                max-width: 55%;
            }

            #goBoard {
                max-height: calc(100vh - 100px);
                width: auto !important;
            }

            .control-panel {
                flex: 0 0 340px;
                max-height: calc(100vh - 80px);
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            .back-button {
                position: absolute;
                top: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">🏠 返回游戏主页</a>
    
    <!-- 游戏结果弹窗 -->
    <div class="game-result-modal" id="resultModal">
        <div class="result-content">
            <div class="result-icon" id="resultIcon">🎉</div>
            <div class="result-title" id="resultTitle">胜利</div>
            <div class="result-details" id="resultDetails"></div>
            <div class="result-buttons">
                <button class="result-btn primary" onclick="closeResultModal(); restartGame();">再来一局</button>
                <button class="result-btn secondary" onclick="closeResultModal();">继续研究</button>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="board-wrapper">
            <canvas id="goBoard" width="570" height="570"></canvas>
        </div>

        <div class="control-panel">
            <h1 class="game-title">⚫⚪ 围棋</h1>

            <div class="mode-selector">
                <h4>🎯 对弈模式</h4>
                <div class="mode-buttons">
                    <button class="mode-btn" onclick="setMode('pvp')">双人对战</button>
                    <button class="mode-btn active" onclick="setMode('pve')">人机对弈</button>
                </div>
                <div class="difficulty-selector show" id="difficultySelector">
                    <label>难度选择：</label>
                    <div class="difficulty-buttons">
                        <button class="diff-btn" onclick="setDifficulty('easy')">简单</button>
                        <button class="diff-btn active" onclick="setDifficulty('medium')">中等</button>
                        <button class="diff-btn" onclick="setDifficulty('hard')">困难</button>
                    </div>
                </div>
            </div>

            <div class="player-section active" id="blackPlayer">
                <div class="stone-display black"></div>
                <div class="player-info">
                    <div class="player-name">黑方(玩家)</div>
                    <div class="player-captures">提子: <span id="blackCaptures">0</span></div>
                </div>
            </div>

            <div class="player-section" id="whitePlayer">
                <div class="stone-display white"></div>
                <div class="player-info">
                    <div class="player-name">白方(AI)</div>
                    <div class="player-captures">提子: <span id="whiteCaptures">0</span></div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">手数</div>
                    <div class="stat-value" id="moveCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">连续虚手</div>
                    <div class="stat-value" id="passCount">0</div>
                </div>
            </div>

            <div class="button-group">
                <button class="game-btn btn-restart" onclick="restartGame()">
                    🔄 重新开始
                </button>
                <button class="game-btn btn-pass" onclick="pass()">
                    ⏭️ 虚手（Pass）
                </button>
                <button class="game-btn btn-undo" onclick="undoMove()" id="undoBtn">
                    ↩️ 悔棋
                </button>
                <button class="game-btn btn-score" onclick="calculateScore()">
                    🏆 计算胜负
                </button>
            </div>

            <div class="message-box" id="messageBox"></div>

            <div class="rules-section" id="rulesSection">
                <h4 onclick="toggleRules()">📖 游戏规则</h4>
                <div class="rules-content">
                    <ul>
                        <li>13×13路棋盘，更适合快速对弈</li>
                        <li>黑方先行，双方轮流落子</li>
                        <li>气尽的棋子会被提掉</li>
                        <li>禁止全局同形（打劫需隔手）</li>
                        <li>双方连续虚手则游戏结束</li>
                        <li>点击"计算胜负"查看结果</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ 音效系统 ============
        const AudioSystem = {
            // 创建音频上下文
            audioContext: null,
            
            init() {
                // 使用Web Audio API创建音频上下文
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            },

            // 播放落子音效
            playStoneSound() {
                if (!this.audioContext) this.init();
                
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                // 清脆的"啪"声
                oscillator.frequency.setValueAtTime(800, this.audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, this.audioContext.currentTime + 0.05);
                
                gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.1);
                
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + 0.1);
            },

            // 播放胜利音效
            playVictorySound() {
                if (!this.audioContext) this.init();
                
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                const startTime = this.audioContext.currentTime;
                
                notes.forEach((freq, index) => {
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(freq, startTime + index * 0.15);
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0, startTime + index * 0.15);
                    gainNode.gain.linearRampToValueAtTime(0.4, startTime + index * 0.15 + 0.02);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + index * 0.15 + 0.3);
                    
                    oscillator.start(startTime + index * 0.15);
                    oscillator.stop(startTime + index * 0.15 + 0.3);
                });
            },

            // 播放失败音效
            playDefeatSound() {
                if (!this.audioContext) this.init();
                
                const notes = [493.88, 440.00, 392.00, 349.23]; // B4, A4, G4, F4 (下降音阶)
                const startTime = this.audioContext.currentTime;
                
                notes.forEach((freq, index) => {
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(freq, startTime + index * 0.2);
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0, startTime + index * 0.2);
                    gainNode.gain.linearRampToValueAtTime(0.3, startTime + index * 0.2 + 0.02);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + index * 0.2 + 0.4);
                    
                    oscillator.start(startTime + index * 0.2);
                    oscillator.stop(startTime + index * 0.2 + 0.4);
                });
            },

            // 播放平局音效
            playDrawSound() {
                if (!this.audioContext) this.init();
                
                const freq = 440; // A4
                const startTime = this.audioContext.currentTime;
                
                for (let i = 0; i < 3; i++) {
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(freq, startTime + i * 0.3);
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0, startTime + i * 0.3);
                    gainNode.gain.linearRampToValueAtTime(0.2, startTime + i * 0.3 + 0.02);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + i * 0.3 + 0.25);
                    
                    oscillator.start(startTime + i * 0.3);
                    oscillator.stop(startTime + i * 0.3 + 0.25);
                }
            }
        };

        // 初始化音效系统
        AudioSystem.init();

        // 显示游戏结果弹窗
        function showResultModal(result, details) {
            const modal = document.getElementById('resultModal');
            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');
            const detailsElem = document.getElementById('resultDetails');
            
            if (result === 'victory') {
                icon.textContent = '🎉';
                title.textContent = '恭喜胜利！';
                title.className = 'result-title victory';
                AudioSystem.playVictorySound();
            } else if (result === 'defeat') {
                icon.textContent = '😢';
                title.textContent = '遗憾落败';
                title.className = 'result-title defeat';
                AudioSystem.playDefeatSound();
            } else {
                icon.textContent = '🤝';
                title.textContent = '平局';
                title.className = 'result-title';
                AudioSystem.playDrawSound();
            }
            
            detailsElem.innerHTML = details;
            modal.classList.add('show');
        }

        // 关闭游戏结果弹窗
        function closeResultModal() {
            const modal = document.getElementById('resultModal');
            modal.classList.remove('show');
        }

        // ============ 原有游戏逻辑 ============
        const canvas = document.getElementById('goBoard');
        const ctx = canvas.getContext('2d');
        const BOARD_SIZE = 13; // 改为13×13棋盘，更适合移动设备
        let CELL_SIZE = 30;
        let STONE_RADIUS = 13;
        let MARGIN = 30;

        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        let currentPlayer = 1; // 1: 黑, 2: 白
        let moveHistory = [];
        let moveCount = 0;
        let blackCaptures = 0;
        let whiteCaptures = 0;
        let passCount = 0;
        let lastBoardState = null;
        let gameMode = 'pve'; // 'pvp' 或 'pve'
        let aiDifficulty = 'medium'; // 'easy', 'medium', 'hard'
        let isAIThinking = false;

        // 更新绘制参数
        function updateDrawingParams() {
            const canvasSize = canvas.width;
            MARGIN = canvasSize * 0.08; // 8%的边距
            CELL_SIZE = (canvasSize - 2 * MARGIN) / (BOARD_SIZE - 1);
            STONE_RADIUS = CELL_SIZE * 0.45; // 增大棋子，从0.43改为0.45
        }

        // 绘制棋盘
        function drawBoard() {
            // 更新绘制参数
            updateDrawingParams();
            
            // 背景
            ctx.fillStyle = '#daa520';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 网格线
            ctx.strokeStyle = '#8b4513';
            ctx.lineWidth = 2; // 增粗线条，从1.5改为2

            for (let i = 0; i < BOARD_SIZE; i++) {
                // 垂直线
                ctx.beginPath();
                ctx.moveTo(MARGIN + i * CELL_SIZE, MARGIN);
                ctx.lineTo(MARGIN + i * CELL_SIZE, MARGIN + (BOARD_SIZE - 1) * CELL_SIZE);
                ctx.stroke();

                // 水平线
                ctx.beginPath();
                ctx.moveTo(MARGIN, MARGIN + i * CELL_SIZE);
                ctx.lineTo(MARGIN + (BOARD_SIZE - 1) * CELL_SIZE, MARGIN + i * CELL_SIZE);
                ctx.stroke();
            }

            // 星位（13路盘的星位）
            const starPoints = [
                [3, 3], [3, 9],
                [6, 6],
                [9, 3], [9, 9]
            ];

            ctx.fillStyle = '#8b4513';
            const starRadius = CELL_SIZE * 0.15; // 增大星位点
            starPoints.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(MARGIN + x * CELL_SIZE, MARGIN + y * CELL_SIZE, starRadius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // 绘制棋子
        function drawStone(x, y, player, isLast = false) {
            const centerX = MARGIN + x * CELL_SIZE;
            const centerY = MARGIN + y * CELL_SIZE;

            // 阴影
            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            if (player === 1) {
                // 黑子
                const gradient = ctx.createRadialGradient(
                    centerX - STONE_RADIUS * 0.3, centerY - STONE_RADIUS * 0.3, 0,
                    centerX, centerY, STONE_RADIUS
                );
                gradient.addColorStop(0, '#4a4a4a');
                gradient.addColorStop(1, '#000000');
                ctx.fillStyle = gradient;
            } else {
                // 白子
                const gradient = ctx.createRadialGradient(
                    centerX - STONE_RADIUS * 0.3, centerY - STONE_RADIUS * 0.3, 0,
                    centerX, centerY, STONE_RADIUS
                );
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, '#d0d0d0');
                ctx.fillStyle = gradient;
            }

            ctx.beginPath();
            ctx.arc(centerX, centerY, STONE_RADIUS, 0, Math.PI * 2);
            ctx.fill();

            // 重置阴影
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // 最后一手标记
            if (isLast) {
                ctx.fillStyle = player === 1 ? '#ffffff' : '#ff0000';
                ctx.beginPath();
                ctx.arc(centerX, centerY, STONE_RADIUS * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 重绘棋盘
        function redraw() {
            drawBoard();
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] !== 0) {
                        const isLast = moveHistory.length > 0 && 
                                      moveHistory[moveHistory.length - 1].x === i && 
                                      moveHistory[moveHistory.length - 1].y === j;
                        drawStone(i, j, board[i][j], isLast);
                    }
                }
            }
        }

        // 获取棋子的气
        function getLiberties(x, y, visited = new Set()) {
            const key = `${x},${y}`;
            if (visited.has(key)) return 0;
            visited.add(key);

            const player = board[x][y];
            if (player === 0) return 0;

            let liberties = 0;
            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];

            for (let [dx, dy] of directions) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                    if (board[nx][ny] === 0) {
                        liberties++;
                    } else if (board[nx][ny] === player) {
                        liberties += getLiberties(nx, ny, visited);
                    }
                }
            }

            return liberties;
        }

        // 移除死子
        function removeDeadStones(x, y, player) {
            const opponent = player === 1 ? 2 : 1;
            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            let captured = 0;

            for (let [dx, dy] of directions) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                    if (board[nx][ny] === opponent && getLiberties(nx, ny) === 0) {
                        captured += removeGroup(nx, ny);
                    }
                }
            }

            return captured;
        }

        // 移除一组棋子
        function removeGroup(x, y) {
            const player = board[x][y];
            if (player === 0) return 0;

            board[x][y] = 0;
            let count = 1;

            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            for (let [dx, dy] of directions) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                    if (board[nx][ny] === player) {
                        count += removeGroup(nx, ny);
                    }
                }
            }

            return count;
        }

        // 复制棋盘状态
        function copyBoard() {
            return board.map(row => [...row]);
        }

        // 比较棋盘状态
        function boardsEqual(board1, board2) {
            if (!board1 || !board2) return false;
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board1[i][j] !== board2[i][j]) return false;
                }
            }
            return true;
        }

        // 获取触摸/点击坐标
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // 计算canvas内的相对坐标
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // 处理落子
        function handleMove(clickX, clickY) {
            if (isAIThinking) return;
            if (gameMode === 'pve' && currentPlayer === 2) return; // 人机模式下不允许玩家操作AI

            // 确保使用最新的绘制参数
            updateDrawingParams();
            
            const x = Math.round((clickX - MARGIN) / CELL_SIZE);
            const y = Math.round((clickY - MARGIN) / CELL_SIZE);

            if (x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE && board[x][y] === 0) {
                if (makeMove(x, y)) {
                    // 如果是人机模式且轮到AI
                    if (gameMode === 'pve' && currentPlayer === 2) {
                        setTimeout(() => aiMove(), 800);
                    }
                }
            }
        }

        // 执行落子
        function makeMove(x, y) {
            // 保存当前状态
            const previousBoard = copyBoard();

            // 放置棋子
            board[x][y] = currentPlayer;

            // 移除对方死子
            const captured = removeDeadStones(x, y, currentPlayer);

            // 检查自杀手（自己没气）
            if (captured === 0 && getLiberties(x, y) === 0) {
                board = previousBoard;
                if (gameMode === 'pvp' || currentPlayer === 1) {
                    showMessage('不能下自杀手！', 'warning');
                }
                return false;
            }

            // 检查打劫（全局同形）
            if (lastBoardState && boardsEqual(board, lastBoardState)) {
                board = previousBoard;
                if (gameMode === 'pvp' || currentPlayer === 1) {
                    showMessage('禁止全局同形（打劫需隔手）！', 'warning');
                }
                return false;
            }

            // 播放落子音效
            AudioSystem.playStoneSound();

            // 记录历史
            moveHistory.push({
                x, y,
                player: currentPlayer,
                captured,
                previousBoard: previousBoard
            });

            // 更新提子数
            if (currentPlayer === 1) {
                blackCaptures += captured;
                document.getElementById('blackCaptures').textContent = blackCaptures;
            } else {
                whiteCaptures += captured;
                document.getElementById('whiteCaptures').textContent = whiteCaptures;
            }

            // 更新手数
            moveCount++;
            document.getElementById('moveCount').textContent = moveCount;

            // 保存上一步棋盘状态
            lastBoardState = previousBoard;

            // 重置虚手计数
            passCount = 0;
            document.getElementById('passCount').textContent = passCount;

            // 切换玩家
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updatePlayerDisplay();

            // 启用悔棋按钮
            document.getElementById('undoBtn').disabled = false;

            redraw();
            return true;
        }

        // AI落子
        function aiMove() {
            if (isAIThinking) return;
            
            isAIThinking = true;
            const move = getBestMove();
            
            if (move) {
                makeMove(move.x, move.y);
            } else {
                // 没有合适的位置，AI选择虚手
                pass();
            }
            
            isAIThinking = false;
        }

        // 获取最佳落子位置
        function getBestMove() {
            // 1. 检查是否可以吃掉对方的子
            const captureMove = findCaptureMove();
            if (captureMove) return captureMove;

            // 2. 检查自己的棋是否需要补气
            const defendMove = findDefendMove();
            if (defendMove && Math.random() > 0.3) return defendMove;

            // 3. 根据难度选择策略
            if (aiDifficulty === 'hard') {
                return getStrategicMove();
            } else if (aiDifficulty === 'medium') {
                return Math.random() > 0.3 ? getStrategicMove() : getRandomMove();
            } else {
                return Math.random() > 0.7 ? getStrategicMove() : getRandomMove();
            }
        }

        // 寻找可以吃子的位置
        function findCaptureMove() {
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === 0 && isValidMove(i, j, 2)) {
                        board[i][j] = 2;
                        const captured = countWouldCapture(i, j, 2);
                        board[i][j] = 0;
                        if (captured > 0) {
                            return { x: i, y: j };
                        }
                    }
                }
            }
            return null;
        }

        // 寻找需要防守的位置
        function findDefendMove() {
            const dangerousStones = [];
            
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === 2) {
                        const liberties = getLiberties(i, j);
                        if (liberties <= 2) {
                            dangerousStones.push({ x: i, y: j, liberties });
                        }
                    }
                }
            }

            // 为危险的棋子补气
            for (let stone of dangerousStones) {
                const libertyPos = findLibertyPosition(stone.x, stone.y);
                if (libertyPos && isValidMove(libertyPos.x, libertyPos.y, 2)) {
                    return libertyPos;
                }
            }

            return null;
        }

        // 找到一个气的位置
        function findLibertyPosition(x, y) {
            const visited = new Set();
            const liberties = [];
            findGroupLiberties(x, y, visited, liberties);
            return liberties.length > 0 ? liberties[0] : null;
        }

        // 找到一组棋的所有气
        function findGroupLiberties(x, y, visited, liberties) {
            const key = `${x},${y}`;
            if (visited.has(key)) return;
            visited.add(key);

            const player = board[x][y];
            if (player === 0) return;

            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            for (let [dx, dy] of directions) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                    if (board[nx][ny] === 0) {
                        liberties.push({ x: nx, y: ny });
                    } else if (board[nx][ny] === player) {
                        findGroupLiberties(nx, ny, visited, liberties);
                    }
                }
            }
        }

        // 计算会吃掉多少子
        function countWouldCapture(x, y, player) {
            const opponent = player === 1 ? 2 : 1;
            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            let captured = 0;

            for (let [dx, dy] of directions) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                    if (board[nx][ny] === opponent) {
                        const visited = new Set();
                        const liberties = countLiberties(nx, ny, visited);
                        if (liberties === 0) {
                            captured += countGroupSize(nx, ny, new Set());
                        }
                    }
                }
            }

            return captured;
        }

        // 计算棋块大小
        function countGroupSize(x, y, visited) {
            const key = `${x},${y}`;
            if (visited.has(key)) return 0;
            visited.add(key);

            const player = board[x][y];
            if (player === 0) return 0;

            let size = 1;
            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            for (let [dx, dy] of directions) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[nx][ny] === player) {
                    size += countGroupSize(nx, ny, visited);
                }
            }

            return size;
        }

        // 计算气数
        function countLiberties(x, y, visited) {
            const key = `${x},${y}`;
            if (visited.has(key)) return 0;
            visited.add(key);

            const player = board[x][y];
            if (player === 0) return 0;

            let liberties = 0;
            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];

            for (let [dx, dy] of directions) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                    if (board[nx][ny] === 0) {
                        liberties++;
                    } else if (board[nx][ny] === player) {
                        liberties += countLiberties(nx, ny, visited);
                    }
                }
            }

            return liberties;
        }

        // 检查是否是合法落子
        function isValidMove(x, y, player) {
            if (board[x][y] !== 0) return false;

            const previousBoard = copyBoard();
            board[x][y] = player;

            // 检查是否能吃子
            const captured = countWouldCapture(x, y, player);

            // 检查自杀手
            const isValid = captured > 0 || getLiberties(x, y) > 0;

            board = previousBoard;
            return isValid;
        }

        // 获取策略性落子位置
        function getStrategicMove() {
            let bestScore = -Infinity;
            let bestMoves = [];

            // 评估所有可能的位置
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === 0 && isValidMove(i, j, 2)) {
                        const score = evaluatePosition(i, j, 2);
                        if (score > bestScore) {
                            bestScore = score;
                            bestMoves = [{ x: i, y: j }];
                        } else if (score === bestScore) {
                            bestMoves.push({ x: i, y: j });
                        }
                    }
                }
            }

            if (bestMoves.length > 0) {
                return bestMoves[Math.floor(Math.random() * bestMoves.length)];
            }

            return getRandomMove();
        }

        // 评估位置得分
        function evaluatePosition(x, y, player) {
            let score = 0;

            // 1. 评估位置本身的价值
            const centerDistance = Math.abs(x - 9) + Math.abs(y - 9);
            score += (19 - centerDistance) * 2; // 靠近中心得分高

            // 2. 评估周围棋子
            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            let friendlyNeighbors = 0;
            let enemyNeighbors = 0;

            for (let [dx, dy] of directions) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                    if (board[nx][ny] === player) {
                        friendlyNeighbors++;
                    } else if (board[nx][ny] !== 0) {
                        enemyNeighbors++;
                    }
                }
            }

            score += friendlyNeighbors * 10; // 连接己方棋子
            score += enemyNeighbors * 5;     // 靠近敌方棋子（压制）

            // 3. 星位加分
            const starPoints = [[3, 3], [3, 9], [3, 15], [9, 3], [9, 9], [9, 15], [15, 3], [15, 9], [15, 15]];
            if (starPoints.some(([sx, sy]) => sx === x && sy === y)) {
                score += 20;
            }

            // 4. 边角加分
            if (x <= 3 || x >= 15 || y <= 3 || y >= 15) {
                score += 15;
            }

            return score;
        }

        // 获取随机落子位置
        function getRandomMove() {
            const emptyCells = [];

            // 优先考虑有邻居的位置
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === 0 && isValidMove(i, j, 2)) {
                        if (hasNeighbor(i, j) || Math.random() > 0.8) {
                            emptyCells.push({ x: i, y: j });
                        }
                    }
                }
            }

            // 如果没有找到合适的位置，考虑所有空位
            if (emptyCells.length === 0) {
                for (let i = 0; i < BOARD_SIZE; i++) {
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        if (board[i][j] === 0 && isValidMove(i, j, 2)) {
                            emptyCells.push({ x: i, y: j });
                        }
                    }
                }
            }

            if (emptyCells.length > 0) {
                return emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }

            return null;
        }

        // 检查是否有邻居
        function hasNeighbor(x, y) {
            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            for (let [dx, dy] of directions) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[nx][ny] !== 0) {
                    return true;
                }
            }
            return false;
        }

        // 设置游戏模式
        function setMode(mode) {
            gameMode = mode;
            
            // 更新按钮样式
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 显示/隐藏难度选择
            const diffSelector = document.getElementById('difficultySelector');
            if (mode === 'pve') {
                diffSelector.classList.add('show');
                document.querySelector('#whitePlayer .player-name').textContent = '白方(AI)';
            } else {
                diffSelector.classList.remove('show');
                document.querySelector('#whitePlayer .player-name').textContent = '白方(玩家)';
            }
            
            restartGame();
        }

        // 设置难度
        function setDifficulty(difficulty) {
            aiDifficulty = difficulty;
            
            // 更新按钮样式
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // 处理点击和触摸事件
        canvas.addEventListener('click', (e) => {
            const coords = getCoordinates(e);
            handleMove(coords.x, coords.y);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const coords = getCoordinates(e);
            handleMove(coords.x, coords.y);
        });

        // 虚手
        function pass() {
            passCount++;
            document.getElementById('passCount').textContent = passCount;

            if (passCount >= 2) {
                showMessage('双方连续虚手，游戏结束！点击"计算胜负"查看结果。', 'success');
                return;
            }

            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updatePlayerDisplay();
            showMessage(`${currentPlayer === 1 ? '黑方' : '白方'}选择虚手`, 'info');
        }

        // 悔棋
        function undoMove() {
            if (moveHistory.length === 0 || isAIThinking) return;

            // 人机模式下，要悔两步（玩家和AI）
            const steps = (gameMode === 'pve' && moveHistory.length >= 2) ? 2 : 1;
            
            for (let i = 0; i < steps && moveHistory.length > 0; i++) {
                const lastMove = moveHistory.pop();
                board = lastMove.previousBoard;

                // 恢复提子数
                if (lastMove.player === 1) {
                    blackCaptures -= lastMove.captured;
                    document.getElementById('blackCaptures').textContent = blackCaptures;
                } else {
                    whiteCaptures -= lastMove.captured;
                    document.getElementById('whiteCaptures').textContent = whiteCaptures;
                }

                // 恢复手数
                moveCount--;
                document.getElementById('moveCount').textContent = moveCount;
            }

            // 恢复玩家
            currentPlayer = 1; // 悔棋后总是轮到玩家
            updatePlayerDisplay();

            // 恢复上一步棋盘状态
            if (moveHistory.length > 0) {
                lastBoardState = moveHistory[moveHistory.length - 1].previousBoard;
            } else {
                lastBoardState = null;
            }

            if (moveHistory.length === 0) {
                document.getElementById('undoBtn').disabled = true;
            }

            redraw();
        }

        // 更新玩家显示
        function updatePlayerDisplay() {
            const blackPlayer = document.getElementById('blackPlayer');
            const whitePlayer = document.getElementById('whitePlayer');

            if (currentPlayer === 1) {
                blackPlayer.classList.add('active');
                whitePlayer.classList.remove('active');
            } else {
                blackPlayer.classList.remove('active');
                whitePlayer.classList.add('active');
            }
        }

        // 计算胜负（简化版）
        function calculateScore() {
            let blackTerritory = 0;
            let whiteTerritory = 0;

            // 简单计算：统计棋子数量
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === 1) blackTerritory++;
                    if (board[i][j] === 2) whiteTerritory++;
                }
            }

            // 加上提子
            blackTerritory += blackCaptures;
            whiteTerritory += whiteCaptures;

            // 白方贴7.5目
            whiteTerritory += 7.5;

            const winner = blackTerritory > whiteTerritory ? '黑方' : '白方';
            const diff = Math.abs(blackTerritory - whiteTerritory).toFixed(1);

            // 判断玩家胜负
            let result;
            if (gameMode === 'pve') {
                // 人机模式：玩家是黑方
                result = blackTerritory > whiteTerritory ? 'victory' : 'defeat';
            } else {
                // 双人模式：显示获胜方
                result = blackTerritory > whiteTerritory ? 'blackWin' : 'whiteWin';
            }

            // 准备详细信息
            const details = `
                <div class="result-score">黑方：${blackTerritory} 目</div>
                <div class="result-score">白方：${whiteTerritory.toFixed(1)} 目（含贴目7.5）</div>
                <div class="result-score" style="color: #667eea; font-size: 1.8rem; margin-top: 20px;">
                    ${winner}胜 ${diff} 目
                </div>
            `;

            // 显示结果弹窗
            if (gameMode === 'pve') {
                showResultModal(result, details);
            } else {
                // 双人模式显示获胜方
                const pvpResult = blackTerritory > whiteTerritory ? 'victory' : (blackTerritory < whiteTerritory ? 'defeat' : 'draw');
                showResultModal(pvpResult, details);
            }

            // 同时在消息框显示
            showMessage(
                `黑方: ${blackTerritory}目 | 白方: ${whiteTerritory.toFixed(1)}目\n${winner}胜 ${diff}目`,
                'success'
            );
        }

        // 显示消息
        function showMessage(text, type = 'info') {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = text;
            messageBox.className = `message-box show ${type}`;
        }

        // 重新开始
        function restartGame() {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
            currentPlayer = 1;
            moveHistory = [];
            moveCount = 0;
            blackCaptures = 0;
            whiteCaptures = 0;
            passCount = 0;
            lastBoardState = null;
            isAIThinking = false;

            document.getElementById('moveCount').textContent = moveCount;
            document.getElementById('passCount').textContent = passCount;
            document.getElementById('blackCaptures').textContent = blackCaptures;
            document.getElementById('whiteCaptures').textContent = whiteCaptures;
            document.getElementById('undoBtn').disabled = true;
            document.getElementById('messageBox').className = 'message-box';

            updatePlayerDisplay();
            redraw();
        }

        // 初始化
        function init() {
            // 响应式调整canvas大小
            function resizeCanvas() {
                const container = document.querySelector('.board-wrapper');
                if (!container) return;
                
                const containerWidth = container.clientWidth - 60; // 减少padding占用
                const containerHeight = window.innerHeight - 100;
                
                // 根据屏幕尺寸调整棋盘大小
                let maxSize = 600; // 增大默认尺寸
                
                // iPad 和平板适配
                if (window.innerWidth >= 768 && window.innerWidth <= 1024) {
                    maxSize = Math.min(containerWidth, containerHeight - 50, 550);
                }
                // 手机适配
                else if (window.innerWidth < 768) {
                    maxSize = Math.min(containerWidth, window.innerWidth - 40);
                }
                // 横屏适配
                if (window.matchMedia('(orientation: landscape)').matches && window.innerHeight < 900) {
                    maxSize = Math.min(containerWidth, containerHeight - 50);
                }
                
                const size = Math.min(maxSize, containerWidth);
                canvas.width = size;
                canvas.height = size;
                
                // 更新绘制参数并重绘
                updateDrawingParams();
                redraw();
            }

            // 监听窗口大小变化和方向变化
            window.addEventListener('resize', () => {
                setTimeout(resizeCanvas, 100);
            });
            window.addEventListener('orientationchange', () => {
                setTimeout(resizeCanvas, 300);
            });
            
            // 确保DOM加载完成后再调整
            setTimeout(() => {
                resizeCanvas();
                updatePlayerDisplay();
                document.getElementById('undoBtn').disabled = true;
            }, 100);
        }

        init();

        // 切换规则显示
        function toggleRules() {
            const rulesSection = document.getElementById('rulesSection');
            rulesSection.classList.toggle('collapsed');
        }

        // iPad上默认收起规则
        if (window.innerWidth >= 768 && window.innerWidth <= 1024) {
            document.getElementById('rulesSection').classList.add('collapsed');
        }
    </script>
</body>
</html>
